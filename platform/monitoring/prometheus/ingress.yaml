# Prometheus UI on the shared django-api ALB at /prometheus.
#
# WARNING: Prometheus has NO built-in authentication. This ingress exposes it
# on the public, internet-facing ALB — anyone with the URL can read all your
# cluster metrics. Prefer reaching Prometheus via `kubectl port-forward` and
# leaving this ingress unapplied, unless you front the ALB with auth.
#
# group.order 40 keeps it above the frontend catch-all "/" (100).
# Prometheus is configured with --web.route-prefix=/prometheus so it serves
# correctly under this path (see deployment.yaml).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prometheus-ingress
  namespace: monitoring
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /prometheus/-/ready
    alb.ingress.kubernetes.io/group.name: django-api
    alb.ingress.kubernetes.io/group.order: '40'
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /prometheus
            pathType: Prefix
            backend:
              service:
                name: prometheus
                port:
                  number: 9090
